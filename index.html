<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1211">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<title>Baanmeter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e1211; color: #fff;
    display: flex; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none; overflow: hidden;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; flex: 0 0 auto; gap: 10px; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: 2.5px; color: rgba(255,255,255,.5); }
  #hdrRight { display: flex; gap: 10px; align-items: baseline; }
  #wind { font-size: 12px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
  #acc { font-size: 12px; color: rgba(255,255,255,.4); font-variant-numeric: tabular-nums; }
  #acc.good { color: #6ec59a; }
  #acc.bad { color: #e0a030; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #mapWrap { flex: 1 1 auto; min-height: 0; position: relative; margin: 10px 0 4px; }
  #map {
    position: absolute; inset: 0; border-radius: 16px;
    background: #1a1f1d; /* tiles weg? dan blijft het gewoon een radar */
  }
  /* kompas: waar kijk ik heen — naald draait mee met de telefoon */
  #compass { position: absolute; top: 10px; right: 10px; z-index: 800; width: 60px; text-align: center; cursor: pointer; }
  #compassBadge {
    width: 46px; height: 46px; margin: 0 auto; border-radius: 50%;
    background: rgba(14,18,17,.82); border: 1px solid rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center;
  }
  #needle { transition: transform .2s; }
  #compassTxt {
    font-size: 10.5px; font-weight: 600; color: rgba(255,255,255,.75); margin-top: 3px;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000;
  }
  .leaflet-container { font: inherit; background: #1a1f1d; }
  /* OSM-basistiles zijn licht — invert maakt er een kalme donkere kaart van.
     Alleen de basislaag: de betonning-laag houdt z'n echte boeikleuren. */
  .base-tiles .leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(.8) saturate(.45) contrast(.9); }
  /* lichte modus: klassieke waterkaart-look (OSM + betonning, ongefilterd) */
  #map.light .base-tiles .leaflet-tile { filter: none; }
  #map.light { background: #d8e2df; }
  .leaflet-control-attribution { background: rgba(14,18,17,.7) !important; color: rgba(255,255,255,.4) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: rgba(255,255,255,.55) !important; }
  .boat-icon { filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .lenlabel {
    background: rgba(14,18,17,.85); color: #7ee2a8; font-weight: 700; font-size: 12px;
    padding: 3px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums;
    border: 1px solid rgba(126,226,168,.35);
  }

  #panel { flex: 0 0 auto; }
  .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 1.6px; color: rgba(255,255,255,.42); }
  #km { font-size: min(13.5vw, 66px); line-height: 1.05; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1.5px; }
  #km small { font-size: .38em; font-weight: 500; color: rgba(255,255,255,.5); letter-spacing: 0; }
  #km .paren { font-size: .3em; font-weight: 500; color: rgba(255,255,255,.42); letter-spacing: 0; }
  #sub { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.6); }

  #target {
    margin-top: 12px; padding: 12px 15px; border-radius: 13px;
    background: rgba(255,255,255,.07); display: flex; align-items: center; gap: 9px;
    font-variant-numeric: tabular-nums; transition: background .3s;
  }
  #target.hit { background: rgba(46,125,79,.4); }
  #target .delta { margin-left: auto; font-weight: 700; font-size: 16px; }
  #target.hit .delta { color: #7ee2a8; }
  #targetInput {
    width: 70px; background: transparent; border: 0; border-bottom: 1px solid rgba(255,255,255,.3);
    color: #fff; font-size: 16px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums;
  }
  #targetInput:focus { outline: none; border-color: #fff; }
  .unit { font-size: 14px; color: rgba(255,255,255,.6); }

  /* presets: de vaste banen van het comité — NM + richting in één tik */
  #presets { display: none; gap: 7px; margin-top: 10px; }
  #presets button {
    flex: 1; border: 1px solid rgba(255,255,255,.22); background: transparent; color: rgba(255,255,255,.75);
    border-radius: 11px; padding: 10px 2px; font-size: 11.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #presets button.on { border-color: rgba(126,226,168,.55); color: #7ee2a8; background: rgba(126,226,168,.08); }

  #meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; min-height: 30px; flex-wrap: wrap; }
  #bearingTxt { font-size: 12.5px; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
  #axisBtn, #seaBtn, #lightBtn {
    border: 1px solid rgba(255,255,255,.25); background: transparent;
    color: rgba(255,255,255,.7); border-radius: 10px; padding: 6px 11px; font-size: 12px; font-weight: 600;
  }
  #axisBtn { margin-left: auto; }
  #axisBtn.on, #seaBtn.on, #lightBtn.on { border-color: rgba(126,226,168,.5); color: #7ee2a8; }

  #km.status { font-size: 23px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.25; }

  footer { flex: 0 0 auto; display: flex; align-items: stretch; gap: 10px; margin-top: 12px; }
  #actionBtn {
    flex: 1; border: 0; border-radius: 15px; background: #175E54; color: #fff;
    font-weight: 700; font-size: 18px; padding: 17px 14px; letter-spacing: .2px;
    transition: transform .1s;
  }
  #actionBtn:active { transform: scale(.98); }
  #actionBtn:disabled { background: #232826; color: rgba(255,255,255,.3); }
  #resetBtn {
    border: 1px solid rgba(255,155,142,.35); background: transparent; color: #ff9b8e;
    border-radius: 15px; padding: 0 18px; font-size: 14px; font-weight: 600; display: none;
  }
  #err { color: #e0a030; font-size: 13px; text-align: center; margin-top: 8px; display: none; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>BAANMETER</h1>
  <div id="hdrRight">
    <span id="wind"></span>
    <span id="acc">gps zoeken…</span>
  </div>
</header>

<main>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="compass">
      <div id="compassBadge">
        <svg id="needle" width="26" height="26" viewBox="-13 -13 26 26">
          <path d="M0,-10 L5.5,8 L0,4.5 L-5.5,8 Z" fill="#7ee2a8"/>
        </svg>
      </div>
      <div id="compassTxt">kompas</div>
    </div>
  </div>

  <div id="panel">
    <span class="lbl" id="panelLbl">BOEI 1</span>
    <div id="km">Vaar naar de plek<small> voor boei 1</small></div>
    <div id="sub"></div>

    <div id="target" style="display:none">
      <span class="lbl">DOEL</span>
      <input id="targetInput" type="number" inputmode="decimal" step="0.05" min="0.05" value="1.800">
      <span class="unit">km</span>
      <span class="delta" id="delta">–</span>
    </div>

    <div id="presets">
      <button data-nm="1" data-side="1">1 NM ↑</button>
      <button data-nm="1" data-side="-1">1 NM ↓</button>
      <button data-nm="0.8" data-side="1">0.8 NM ↑</button>
      <button data-nm="0.8" data-side="-1">0.8 NM ↓</button>
    </div>

    <div id="meta">
      <span id="bearingTxt"></span>
      <button id="seaBtn" style="display:none">betonning</button>
      <button id="lightBtn" style="display:none">licht</button>
      <button id="axisBtn" style="display:none">windas</button>
    </div>
  </div>

  <footer>
    <button id="actionBtn" disabled>MARKEER BOEI 1</button>
    <button id="resetBtn">Opnieuw</button>
  </footer>
</main>
<p id="err"></p>

<script>
"use strict";
// Baanmeter — wedstrijdbanen uitleggen op exacte lengte.
// Boei 1 markeren → varen (afstand + doel + windas) → boei 2 markeren →
// baanlijn met lengte, en hoeveel graden de baan van de windas af ligt.
const $ = id => document.getElementById(id);
let marks = [];       // [{lat,lon}] — max 2
let cur = null;       // laatste fix
let course = null;    // vaarrichting (GPS)
let trail = [];
let wind = null;      // {kn, deg} (deg = waar de wind vandaan komt)
let axisOn = true;
let seaOn = true;     // betonning-laag (OpenSeaMap)
let suggestSide = 1;  // voorstel boei 2: 1 = upwind, -1 = downwind
let wakeLock = null;

const R = 6371000;
function distM(a, b) {
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 +
    Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function bearingDeg(a, b) {
  const f1 = a.lat*Math.PI/180, f2 = b.lat*Math.PI/180, dl = (b.lon-a.lon)*Math.PI/180;
  const y = Math.sin(dl)*Math.cos(f2);
  const x = Math.cos(f1)*Math.sin(f2) - Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}
function destPoint(p, brgDeg, dM) {
  const br = brgDeg*Math.PI/180, f1 = p.lat*Math.PI/180, l1 = p.lon*Math.PI/180, dr = dM/R;
  const f2 = Math.asin(Math.sin(f1)*Math.cos(dr) + Math.cos(f1)*Math.sin(dr)*Math.cos(br));
  const l2 = l1 + Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(f1), Math.cos(dr)-Math.sin(f1)*Math.sin(f2));
  return { lat: f2*180/Math.PI, lon: ((l2*180/Math.PI)+540)%360-180 };
}
const CARD = ["N","NNO","NO","ONO","O","OZO","ZO","ZZO","Z","ZZW","ZW","WZW","W","WNW","NW","NNW"];

// ---------- kaart ----------
let map = null, tiles = null, seaLayer = null;
let markDots = [], legLine = null, courseLine = null, lenLabel = null, axisLine = null, trailLine = null, boatMarker = null;
let suggestMarker = null; // spookboei: het voorstel voor boei 2, op doelafstand langs de windas
let didInitialCenter = false;

function boatSvg(deg) {
  return L.divIcon({
    className: "boat-icon",
    html: '<svg width="24" height="24" viewBox="-12 -12 24 24" style="transform:rotate(' + deg + 'deg)"><path d="M0,-10 L7,8 L-7,8 Z" fill="#7ee2a8" stroke="#0e1211" stroke-width="1.5"/></svg>',
    iconSize: [24, 24], iconAnchor: [12, 12],
  });
}
function buoySvg() {
  return L.divIcon({
    className: "boat-icon",
    html: '<svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="7" fill="#e0a030" stroke="#0e1211" stroke-width="2"/></svg>',
    iconSize: [18, 18], iconAnchor: [9, 9],
  });
}

function initMap() {
  if (map || typeof L === "undefined" || !cur) return;
  map = L.map("map", { zoomControl: false });
  tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap", maxZoom: 19, className: "base-tiles",
  }).addTo(map);
  // betonning: vaarwegmarkering van OpenSeaMap als losse laag (echte kleuren)
  seaLayer = L.tileLayer("https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenSeaMap", maxZoom: 19,
  });
  if (seaOn) seaLayer.addTo(map);
  $("seaBtn").style.display = "";
  $("seaBtn").classList.toggle("on", seaOn);
  $("lightBtn").style.display = "";
  if (localStorage.getItem("baanmeter-light") === "1") {
    $("map").classList.add("light");
    $("lightBtn").classList.add("on");
  }
  trailLine = L.polyline([], { color: "rgba(255,255,255,.55)", weight: 2, interactive: false }).addTo(map);
  boatMarker = L.marker([cur.lat, cur.lon], { icon: boatSvg(0), interactive: false }).addTo(map);
  map.setView([cur.lat, cur.lon], 15);
  didInitialCenter = true;
}

function updateMap() {
  if (!cur) return;
  initMap();
  if (!map) return;

  // boeien
  while (markDots.length < marks.length) {
    markDots.push(L.marker([0,0], { icon: buoySvg(), interactive: false }).addTo(map));
  }
  marks.forEach((m, i) => markDots[i].setLatLng([m.lat, m.lon]));

  // meetlijn: boei 1 → boot (gestippeld, zolang boei 2 er niet is)
  if (marks.length === 1) {
    if (!legLine) {
      legLine = L.polyline([], { color: "rgba(255,255,255,.5)", weight: 1.5, dashArray: "4 5", interactive: false }).addTo(map);
    }
    legLine.setLatLngs([[marks[0].lat, marks[0].lon], [cur.lat, cur.lon]]);
  } else if (legLine) {
    legLine.remove(); legLine = null;
  }

  // de baan: vaste lijn tussen boei 1 en 2, met lengte-label op het midden
  if (marks.length === 2) {
    const a = marks[0], b = marks[1];
    if (!courseLine) {
      courseLine = L.polyline([], { color: "#7ee2a8", weight: 3, interactive: false }).addTo(map);
      lenLabel = L.marker([0,0], { icon: L.divIcon({ className: "", html: "", iconSize: null }), interactive: false }).addTo(map);
    }
    courseLine.setLatLngs([[a.lat, a.lon], [b.lat, b.lon]]);
    const mid = { lat: (a.lat+b.lat)/2, lon: (a.lon+b.lon)/2 };
    lenLabel.setLatLng([mid.lat, mid.lon]);
    lenLabel.setIcon(L.divIcon({
      className: "",
      html: '<div class="lenlabel">' + (distM(a,b)/1000).toFixed(3) + ' km</div>',
      iconSize: null, iconAnchor: [28, -8],
    }));
  }

  // windas door boei 1 — de lijn waarlangs je een baan hoort te leggen
  const targetM = (parseFloat($("targetInput").value) || 1.8) * 1000;
  if (axisOn && wind && marks.length >= 1) {
    const len = Math.max(targetM * 1.4, 1500);
    const p1 = destPoint(marks[0], wind.deg, len);            // naar de wind toe (upwind)
    const p2 = destPoint(marks[0], (wind.deg+180)%360, len);  // van de wind af
    if (!axisLine) {
      axisLine = L.polyline([], { color: "rgba(140,190,255,.55)", weight: 1.5, dashArray: "8 7", interactive: false }).addTo(map);
    }
    axisLine.setLatLngs([[p1.lat, p1.lon], [marks[0].lat, marks[0].lon], [p2.lat, p2.lon]]);
  } else if (axisLine) {
    axisLine.remove(); axisLine = null;
  }

  // spookboei: voorstel voor boei 2 — doelafstand langs de windas (up of down)
  if (axisOn && wind && marks.length === 1 && targetM > 0) {
    const sug = destPoint(marks[0], suggestSide === 1 ? wind.deg : (wind.deg + 180) % 360, targetM);
    if (!suggestMarker) {
      suggestMarker = L.marker([0, 0], {
        icon: L.divIcon({
          className: "",
          html: '<div style="width:90px;margin-left:-45px;margin-top:-11px;text-align:center">' +
                '<svg width="22" height="22" viewBox="-11 -11 22 22"><circle r="8" fill="rgba(140,190,255,.15)" stroke="#8cbeff" stroke-width="1.5" stroke-dasharray="3.5 3"/></svg>' +
                '<div class="lenlabel" style="color:#8cbeff;border-color:rgba(140,190,255,.4);display:inline-block">voorstel 2</div></div>',
          iconSize: null, iconAnchor: [0, 0],
        }),
        interactive: false,
      }).addTo(map);
      // breng boei 1 én het voorstel samen in beeld — ná layout, anders
      // rekent Leaflet de zoom uit op een container zonder maat
      const b = L.latLngBounds([marks[0].lat, marks[0].lon], [sug.lat, sug.lon]).pad(0.18);
      setTimeout(() => { map.invalidateSize(); map.fitBounds(b); }, 80);
    }
    suggestMarker.setLatLng([sug.lat, sug.lon]);
  } else if (suggestMarker) {
    suggestMarker.remove(); suggestMarker = null;
  }

  trailLine.setLatLngs(trail.map(p => [p.lat, p.lon]));

  // richting bootje: GPS-koers (varen) → kompas (stilliggen) → spoor
  let hdg = course ?? compassDeg;
  if (hdg == null && trail.length > 1) hdg = bearingDeg(trail[trail.length-2], trail[trail.length-1]);
  boatMarker.setLatLng([cur.lat, cur.lon]);
  boatMarker.setIcon(boatSvg(hdg ?? 0));
}

// ---------- wind ----------
// Eerst het dichtstbijzijnde ECHTE meetstation (KNMI + Rijkswaterstaat-
// meetpalen, elke 10 min vers via windapp) — meetpalen óp het water krijgen
// voorrang. Geen station binnen 35 km? Dan modelwind van Open-Meteo op je
// eigen positie.
const STATIONS_URL = "https://bbcyrlnehwnhquarnhil.supabase.co/rest/v1/station_latest?select=name,lat,lon,wind_kn,dir_deg,station_id";
const STATIONS_KEY = "sb_publishable_T22jDT6WHlqcEN9sy6bj6A_cenh2YU8"; // read-only

async function fetchWind() {
  if (!cur) return;
  try {
    const r = await fetch(STATIONS_URL, {
      headers: { apikey: STATIONS_KEY, Authorization: "Bearer " + STATIONS_KEY },
    });
    const stations = (await r.json()).filter(s => s.wind_kn != null && s.dir_deg != null);
    let best = null, bestW = Infinity;
    for (const s of stations) {
      const d = distM(cur, { lat: s.lat, lon: s.lon });
      const w = s.station_id.startsWith("rws:") ? d * 0.7 : d; // waterpaal > vliegveld
      if (w < bestW) { bestW = w; best = { ...s, d }; }
    }
    if (best && best.d <= 35000) {
      wind = { kn: Math.round(best.wind_kn), deg: best.dir_deg };
      const name = best.name.split(",")[0];
      $("wind").textContent = wind.kn + " kn uit " + CARD[Math.round(wind.deg/22.5)%16] + " · " + name;
      $("axisBtn").style.display = "";
      render();
      return;
    }
  } catch (_) { /* stations niet bereikbaar — probeer het model */ }
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + cur.lat.toFixed(3) +
      "&longitude=" + cur.lon.toFixed(3) + "&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=kn");
    const j = await r.json();
    if (j.current) {
      wind = { kn: Math.round(j.current.wind_speed_10m), deg: j.current.wind_direction_10m };
      $("wind").textContent = wind.kn + " kn uit " + CARD[Math.round(wind.deg/22.5)%16] + " · model";
      $("axisBtn").style.display = "";
      render();
    }
  } catch (_) { /* geen bereik — wind komt later wel */ }
}
setInterval(fetchWind, 10 * 60 * 1000);

// ---------- ui ----------
function render() {
  const targetM = parseFloat($("targetInput").value || "0") * 1000;

  if (marks.length === 0) {
    $("panelLbl").textContent = "BOEI 1";
    $("km").classList.add("status");
    $("km").innerHTML = cur ? "Klaar om te markeren — kies je baan" : "Vaar naar de plek voor boei 1";
    $("sub").style.display = "none";
    $("target").style.display = "none";
    $("presets").style.display = "flex"; // baan kiezen kan al vóór het droppen
    $("actionBtn").textContent = "MARKEER BOEI 1";
    $("actionBtn").disabled = !cur;
    $("resetBtn").style.display = "none";
    $("bearingTxt").textContent = "";
  } else if (marks.length === 1 && cur) {
    const m = distM(marks[0], cur);
    $("km").classList.remove("status");
    $("panelLbl").textContent = "AFSTAND TOT BOEI 1";
    $("km").innerHTML = (m/1000).toFixed(3) + "<small> km</small> <span class='paren'>(" + (m/1852).toFixed(2) + " NM)</span>";
    $("sub").style.display = "none";
    $("target").style.display = "flex";
    $("presets").style.display = "flex";
    $("actionBtn").textContent = "MARKEER BOEI 2";
    $("actionBtn").disabled = false;
    $("resetBtn").style.display = "";
    if (targetM > 0) {
      const diff = targetM - m;
      const hit = Math.abs(diff) <= 15;
      $("target").classList.toggle("hit", hit);
      $("delta").textContent = hit ? "✓ hier droppen" :
        (diff > 0 ? "nog " + Math.round(diff) + " m" : Math.round(-diff) + " m voorbij");
    }
    // met wind erbij is de spookboei de actie: koers + afstand ernaartoe
    if (axisOn && wind && targetM > 0) {
      const sug = destPoint(marks[0], suggestSide === 1 ? wind.deg : (wind.deg + 180) % 360, targetM);
      const dSug = distM(cur, sug);
      const bSug = bearingDeg(cur, sug);
      $("bearingTxt").textContent = "→ voorstel 2 (" + (suggestSide === 1 ? "upwind" : "downwind") + "): " +
        (dSug < 1000 ? Math.round(dSug) + " m" : (dSug/1000).toFixed(2) + " km") +
        " richting " + CARD[Math.round(bSug/22.5)%16] + " " + Math.round(bSug) + "°";
    } else {
      const b = bearingDeg(cur, marks[0]);
      $("bearingTxt").textContent = "peiling boei 1: " + CARD[Math.round(b/22.5)%16] + " " + Math.round(b) + "°";
    }
  } else if (marks.length === 2) {
    const len = distM(marks[0], marks[1]);
    $("km").classList.remove("status");
    $("panelLbl").textContent = "BAANLENGTE · BOEI 1 ↔ BOEI 2";
    $("km").innerHTML = (len/1000).toFixed(3) + "<small> km</small> <span class='paren'>(" + (len/1852).toFixed(2) + " NM)</span>";
    if (cur) {
      $("sub").style.display = "";
      $("sub").textContent = Math.round(distM(marks[1], cur)) + " m tot boei 2";
    } else {
      $("sub").style.display = "none";
    }
    $("target").style.display = "none";
    $("presets").style.display = "none";
    $("actionBtn").textContent = "NIEUWE BAAN";
    $("actionBtn").disabled = false;
    $("resetBtn").style.display = "none";
    if (wind) {
      const courseBrg = bearingDeg(marks[0], marks[1]);
      let off = Math.abs(((courseBrg - wind.deg) % 180 + 180) % 180);
      if (off > 90) off = 180 - off;
      $("bearingTxt").textContent = "baan ligt " + Math.round(off) + "° van de windas" + (off <= 10 ? " ✓" : "");
    } else {
      $("bearingTxt").textContent = "";
    }
  }
  updateMap();
}

function onFix(pos) {
  cur = { lat: pos.coords.latitude, lon: pos.coords.longitude };
  if (Number.isFinite(pos.coords.heading)) course = pos.coords.heading;
  const acc = pos.coords.accuracy;
  $("acc").textContent = "gps ±" + Math.round(acc) + " m";
  $("acc").classList.toggle("good", acc <= 8);
  $("acc").classList.toggle("bad", acc > 15);
  $("err").style.display = "none";
  if (!wind) fetchWind();

  if (marks.length >= 1) {
    const last = trail[trail.length - 1];
    if (!last || Date.now() - last.t > 3000) {
      trail.push({ ...cur, t: Date.now() });
      if (trail.length > 800) trail.splice(0, 200);
    }
  }
  render();
}
function onErr(e) {
  $("err").style.display = "block";
  $("err").textContent = e.code === 1
    ? "Geen toestemming voor locatie — zet locatietoegang aan voor deze site."
    : "Geen GPS-fix. Ga naar buiten / check je locatie-instellingen.";
}

// ---------- kompas ----------
// iOS wil expliciete toestemming (na een tik), Android geeft de sensor direct.
// De naald draait naar waar de telefoon heen wijst; het bootje gebruikt 'm
// ook als er geen GPS-koers is (stilliggen).
let compassDeg = null, compassActive = false, compassQueued = false;

function paintCompass() {
  compassQueued = false;
  if (compassDeg == null) return;
  $("needle").style.transform = "rotate(" + compassDeg + "deg)";
  $("compassTxt").textContent = CARD[Math.round(compassDeg / 22.5) % 16] + " " + Math.round(compassDeg) + "°";
  if (boatMarker) updateMap(); // bootje mag meedraaien bij stilliggen
}
function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading; // iOS
  else if (e.alpha != null && (e.absolute || e.type === "deviceorientationabsolute")) h = (360 - e.alpha) % 360;
  if (h == null) return;
  compassDeg = h;
  if (!compassQueued) { compassQueued = true; requestAnimationFrame(paintCompass); }
}
function startCompass() {
  if (compassActive) return;
  const attach = () => {
    compassActive = true;
    window.addEventListener("deviceorientationabsolute", onOrient);
    window.addEventListener("deviceorientation", onOrient);
  };
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === "function") {
    D.requestPermission().then(s => { if (s === "granted") attach(); }).catch(() => {});
  } else {
    attach();
  }
}
$("compass").addEventListener("click", startCompass);
// geen permissieprompt nodig (Android/desktop)? Dan meteen aanzetten
if (!(window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission)) startCompass();

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});
keepAwake();

function persist() {
  localStorage.setItem("baanmeter-marks", JSON.stringify(marks));
}

$("actionBtn").addEventListener("click", () => {
  if (marks.length === 2) { // NIEUWE BAAN
    if (!confirm("Baan wissen en opnieuw beginnen?")) return;
    marks = []; trail = [];
    markDots.forEach(d => d.remove()); markDots = [];
    if (courseLine) { courseLine.remove(); courseLine = null; }
    if (lenLabel) { lenLabel.remove(); lenLabel = null; }
    persist(); render();
    return;
  }
  if (!cur) return;
  marks.push({ ...cur });
  if (marks.length === 1) trail = [{ ...cur, t: Date.now() }];
  if (navigator.vibrate) navigator.vibrate(80);
  persist(); render();
});
$("resetBtn").addEventListener("click", () => {
  if (!confirm("Boei 1 wissen?")) return;
  marks = []; trail = [];
  markDots.forEach(d => d.remove()); markDots = [];
  persist(); render();
});
$("axisBtn").addEventListener("click", () => {
  axisOn = !axisOn;
  $("axisBtn").classList.toggle("on", axisOn);
  render();
});
$("axisBtn").classList.add("on");
$("seaBtn").addEventListener("click", () => {
  seaOn = !seaOn;
  $("seaBtn").classList.toggle("on", seaOn);
  if (map && seaLayer) { seaOn ? seaLayer.addTo(map) : seaLayer.remove(); }
});
$("lightBtn").addEventListener("click", () => {
  const on = $("map").classList.toggle("light");
  $("lightBtn").classList.toggle("on", on);
  localStorage.setItem("baanmeter-light", on ? "1" : "0");
});
// presets: het comité z'n vaste banen — NM + richting in één tik
document.querySelectorAll("#presets button").forEach(btn => {
  btn.addEventListener("click", () => {
    suggestSide = parseInt(btn.dataset.side, 10);
    $("targetInput").value = (parseFloat(btn.dataset.nm) * 1.852).toFixed(3);
    document.querySelectorAll("#presets button").forEach(b => b.classList.toggle("on", b === btn));
    if (suggestMarker) { suggestMarker.remove(); suggestMarker = null; } // hercentreer op het nieuwe voorstel
    render();
  });
});
$("targetInput").addEventListener("input", () => {
  document.querySelectorAll("#presets button").forEach(b => b.classList.remove("on"));
  render();
});
window.addEventListener("resize", () => map && map.invalidateSize());

// boeien overleven een refresh (zon + natte handen + safari…)
try {
  const saved = JSON.parse(localStorage.getItem("baanmeter-marks") || "[]");
  if (Array.isArray(saved) && saved.length) marks = saved.slice(0, 2);
} catch (_) {}

// ?demo — laat de app varen zonder GPS (voor op de bank)
if (new URLSearchParams(location.search).has("demo")) {
  wind = { kn: 14, deg: 25 };
  $("wind").textContent = "14 kn uit NNO";
  $("axisBtn").style.display = "";
  compassDeg = 25; compassQueued = true; paintCompass();
  marks = [];
  let step = -3;
  const demoTick = () => {
    step = Math.min(step + 1, 52);
    if (step < 0) { cur = { lat: 52.3300, lon: 5.0900 }; render(); return; }
    if (step === 0 && marks.length === 0) { marks = [{ lat: 52.3300, lon: 5.0900 }]; trail = []; }
    const p = {
      lat: 52.3300 + 0.01455 * Math.min(step, 44) / 40,
      lon: 5.0900 + 0.0060 * Math.min(step, 44) / 40 + 0.0016 * Math.sin(Math.min(step, 44) / 40 * Math.PI),
    };
    cur = p;
    trail.push({ ...p, t: Date.now() });
    if (step === 44 && marks.length === 1) marks.push({ ...p });
    $("acc").textContent = "demo · gps ±4 m";
    $("acc").classList.add("good");
    render();
  };
  demoTick();
  setInterval(demoTick, 700);
} else {
  navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
}
render();
</script>
</body>
</html>
